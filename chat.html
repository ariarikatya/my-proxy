<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат Амо</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    </style>
</head>
<body>
    <script>
    // 1. Инициализация виджета чата
    window.amoSocialButtonConfig = {
        id: "447579",
        hash: "b95570f94bd347ecf353336f802ec8d904d3709371be22e197a9edf5acb108b4",
        locale: "ru",
        inline: true,
        onlinechat: {
            locale: {
                extends: "ru",
                compose_placeholder: "Задайте вопрос агроному здесь...",
            }
        }
    };

    (function(a,m,o,c,r,m){
        a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
        var d=a.document,s=d.createElement('script');
        s.async=true;s.id=m+'_script';
        s.src='https://gso.amocrm.ru/js/button.js';
        d.head&&d.head.appendChild(s);
    }(window,0,'amoSocialButton',0,0,'amo_social_button'));

    // 2. Логика автоматического открытия и передачи контекста через API
    amoSocialButton('onChatReady', function () {
        // Официально открываем чат без имитации кликов
        amoSocialButton('runChatShow');
        
        // Передаем контекст "ИИ-Диагностика" прямо в метаданные чата
        if (window.amo_social_button && typeof window.amo_social_button.setMeta === 'function') {
            window.amo_social_button.setMeta({
                bot_params: {
                    "Источник_заявки": "ИИ-Диагностика болезней растения"
                }
            });
        }
    });
    </script>
</body>
</html>
