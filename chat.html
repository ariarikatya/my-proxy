<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат Амо</title>
    <style>
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
    </style>
</head>
<body>
    <script>
    // Функция для чтения параметров из URL фрейма
    function getUrlParam(param) {
        var urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Определяем источник заявки (если пустой — ставим дефолт)
    var currentSource = getUrlParam('source') === 'ai_diagnostics' 
        ? "ИИ-Диагностика болезней растений (Клик 'Обратиться к человеку')" 
        : "Основной чат на сайте";

    window.amoSocialButtonConfig = {
        id: "447579",
        hash: "b95570f94bd347ecf353336f802ec8d904d3709371be22e197a9edf5acb108b4",
        locale: "ru",
        inline: true,
        onlinechat: {
            locale: {
                extends: "ru",
                compose_placeholder: "Напишите ваш вопрос агроному здесь...",
            }
        }
    };

    (function(a,m,o,c,r,m){
        a[o]=a[o]||function(){(a[o].q=a[o].q||[]).push(arguments)};
        var d=a.document,s=d.createElement('script');
        s.async=true;s.id=m+'_script';
        s.src='https://gso.amocrm.ru/js/button.js';
        d.head&&d.head.appendChild(s);
    }(window,0,'amoSocialButton',0,0,'amo_social_button'));

    // Официальное автооткрытие чата и передача мета-данных
    amoSocialButton('onChatReady', function () {
        amoSocialButton('runChatShow');
        
        if (window.amo_social_button && typeof window.amo_social_button.setMeta === 'function') {
            window.amo_social_button.setMeta({
                bot_params: {
                    "Источник_заявки": currentSource
                }
            });
        }
    });
    </script>
</body>
</html>
